        ];

        // Classificazione mano secondo il regolamento Briscola a 5
        function classifyHand(deltasObj) {
            const entries = Object.entries(deltasObj || {}).filter(([, val]) => val !== 0);
            const pos = entries.filter(([, val]) => val > 0);
            const neg = entries.filter(([, val]) => val < 0);
            const plus2 = entries.filter(([, val]) => val === 2);
            const plus1 = entries.filter(([, val]) => val === 1);
            const minus1 = entries.filter(([, val]) => val === -1);

            // 120 realizzato: 1 chiamante (+2) e 2 soci (+1)
            if (plus2.length === 1 && plus1.length === 2 && neg.length === 0) {
                return { side: 'attacco', label: 'Attacco (120)', is120: true, winners: pos.map(([id]) => id) };
            }
            // 120 fallito: 2 difensori (+1) e 1 chiamante (-1)
            if (plus1.length === 2 && minus1.length === 1 && pos.length === 2 && neg.length === 1) {
                return { side: 'difesa', label: 'Difesa (120 fallito)', is120: true, winners: plus1.map(([id]) => id) };
            }
            // Attacco standard: 2 giocatori positivi (Chiamante + Socio)
            if (pos.length === 2 && neg.length === 0) {
                return { side: 'attacco', label: 'Attacco', is120: false, winners: pos.map(([id]) => id) };
            }
            // Difesa standard: 3 giocatori positivi (Difensori)
            if (pos.length === 3 && neg.length === 0) {
                return { side: 'difesa', label: 'Difesa', is120: false, winners: pos.map(([id]) => id) };
            }
            // Caso personalizzato/extra
            return { side: 'altro', label: 'Mano Speciale', is120: false, winners: pos.map(([id]) => id) };
        }

        function App() {
            const [view, setView] = useState('home'); // 'home' | 'players' | 'new-table' | 'detail' | 'stats'
            const [user, setUser] = useState(null);
            const [isConnected, setIsConnected] = useState(false);
            const [players, setPlayers] = useState([]);
            const [tables, setTables] = useState([]);
            const [activeTableId, setActiveTableId] = useState(null);
            const [newPlayerName, setNewPlayerName] = useState('');
            const [newTableName, setNewTableName] = useState('');
            const [selectedPlayers, setSelectedPlayers] = useState([]);
            
            // Punti temporanei della mano corrente nel tavolo: { [playerId]: -1 | 0 | 1 | 2 }
            const [handDeltas, setHandDeltas] = useState({});
            // Stato doppia conferma per Annulla Ultima Mano: 0 = chiuso, 1 = primo step, 2 = conferma definitiva
            const [undoStep, setUndoStep] = useState(0);

            const migratedRef = useRef(false);
            const baseP = ['artifacts', window.appId, 'public', 'data'];

            useEffect(() => {
                return window.fb.onAuthStateChanged(window.auth, (u) => {
                    if (!u) window.fb.signInAnonymously(window.auth);
                    setUser(u);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubP = window.fb.onSnapshot(window.fb.collection(window.db, ...baseP, 'players'), (s) => {
                    setPlayers(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsConnected(true);
                }, () => setIsConnected(false));

                const unsubT = window.fb.onSnapshot(window.fb.collection(window.db, ...baseP, 'tables'), (s) => {
                    const loadedTables = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.ts - b.ts);
                    setTables(loadedTables);

                    // Migrazione automatica una-tantum delle 20 mani ricostruite per il tavolo esistente
                    if (!migratedRef.current) {
                        const target = loadedTables.find(t => t.id === LEGACY_TABLE_ID);
                        if (target && !target.handsMigrated && !target.hands) {
                            migratedRef.current = true;
                            window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', LEGACY_TABLE_ID), {
                                ...target,
                                hands: RECONSTRUCTED_HANDS,
                                handsMigrated: true,
                                logs: []
                            });
                        }
                    }
                });
                return () => { unsubP(); unsubT(); };
            }, [user]);

            // Azzera i selettori temporanei quando si cambia tavolo
            useEffect(() => {
                setHandDeltas({});
                setUndoStep(0);
            }, [activeTableId]);

            const addPlayer = async () => {
                if (!newPlayerName.trim()) return;
                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'players', Date.now().toString()), { 
                    name: newPlayerName.trim(),
                    championshipPoints: 0 
                });
                setNewPlayerName('');
            };

            const createTable = async () => {
                if (selectedPlayers.length !== 5 || !newTableName.trim()) return;
                const id = Date.now().toString();
                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', id), {
                    name: newTableName.trim(),
                    ts: Date.now(),
                    players: selectedPlayers.map(p => ({ id: p.id, name: p.name, score: 0 })),
                    hands: [],
                    handsMigrated: true
                });
                setSelectedPlayers([]);
                setNewTableName('');
                setView('home');
            };

            const renameTable = async (tid, currentName) => {
                const newName = prompt("Modifica il nome del tavolo:", currentName);
                if (!newName || !newName.trim() || newName.trim() === currentName) return;
                const t = tables.find(x => x.id === tid);
                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', tid), { 
                    ...t, 
                    name: newName.trim() 
                });
            };

            // Modifica il selettore temporaneo della mano (-1 <= val <= +2)
            const changeHandDelta = (pid, step) => {
                setHandDeltas(prev => {
                    const current = prev[pid] || 0;
                    const next = Math.max(-1, Math.min(2, current + step));
                    return { ...prev, [pid]: next };
                });
            };

            // Salva l'intera mano nel database
            const saveHand = async (tid) => {
                const t = tables.find(x => x.id === tid);
                if (!t) return;

                const cleanDeltas = {};
                let hasChanges = false;
                t.players.forEach(p => {
                    const d = handDeltas[p.id] || 0;
                    cleanDeltas[p.id] = d;
                    if (d !== 0) hasChanges = true;
                });

                if (!hasChanges) return;

                // Aggiorna i punteggi totali (consente anche punteggi negativi es. -1)
                const updatedPlayers = t.players.map(p => ({
                    ...p,
                    score: p.score + (cleanDeltas[p.id] || 0)
                }));

                const nowStr = new Date().toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                const newHand = {
                    id: Date.now().toString(),
                    dateStr: nowStr,
                    deltas: cleanDeltas
                };

                const updatedHands = [...(t.hands || []), newHand];

                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', tid), {
                    ...t,
                    players: updatedPlayers,
                    hands: updatedHands,
                    handsMigrated: true
                });

                setHandDeltas({});
            };

            // Annulla fisicamente l'ultima mano salvata
            const confirmUndoLastHand = async (tid) => {
                const t = tables.find(x => x.id === tid);
                if (!t || !t.hands || t.hands.length === 0) return;

                const lastHand = t.hands[t.hands.length - 1];
                const restoredPlayers = t.players.map(p => ({
                    ...p,
                    score: p.score - (lastHand.deltas[p.id] || 0)
                }));
                const remainingHands = t.hands.slice(0, -1);

                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', tid), {
                    ...t,
                    players: restoredPlayers,
                    hands: remainingHands,
                    handsMigrated: true
                });

                setUndoStep(0);
            };

            const endChampionship = async (tid) => {
                const t = tables.find(x => x.id === tid);
                if (!t) return;

                let maxScore = -Infinity;
                t.players.forEach(p => { if (p.score > maxScore) maxScore = p.score; });

                if (maxScore <= 0 && (!t.hands || t.hands.length === 0)) {
                    alert("Impossibile terminare: nessun punto o mano registrata in questo campionato!");
                    return;
                }

                if (!confirm("Vuoi terminare il campionato attuale? I punteggi e le statistiche del tavolo verranno azzerati e verrà assegnato +1 Punto Campionato ai vincitori.")) return;

                const winners = t.players.filter(p => p.score === maxScore);

                for (const w of winners) {
                    const pDoc = players.find(x => x.id === w.id);
                    if (pDoc) {
                        const currentCPoints = pDoc.championshipPoints || 0;
                        await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'players', w.id), {
                            ...pDoc,
                            championshipPoints: currentCPoints + 1
                        });
                    }
                }

                const resetPlayers = t.players.map(p => ({ ...p, score: 0 }));

                await window.fb.setDoc(window.fb.doc(window.db, ...baseP, 'tables', tid), {
                    ...t,
                    players: resetPlayers,
                    hands: [],
                    logs: [],
                    handsMigrated: true
                });

                setHandDeltas({});
            };

            // Calcolo completo delle statistiche del tavolo attivo
            const computeTableStats = (table) => {
                const hands = table.hands || [];
                const totalHands = hands.length;
                let attackWins = 0;
                let defenseWins = 0;
                let attack120Wins = 0;
                let defense120Wins = 0;

                const playerStats = {};
                table.players.forEach(p => {
                    playerStats[p.id] = {
                        id: p.id,
                        name: p.name,
                        score: p.score,
                        wins: 0,
                        attackWins: 0,
                        defenseWins: 0,
                        plus2Count: 0,
                        minus1Count: 0,
                        currentStreak: 0,
                        bestStreak: 0
                    };
                });

                const pairWins = {};

                hands.forEach(hand => {
                    const info = classifyHand(hand.deltas);
                    if (info.side === 'attacco') {
                        attackWins++;
                        if (info.is120) attack120Wins++;
                    } else if (info.side === 'difesa') {
                        defenseWins++;
                        if (info.is120) defense120Wins++;
                    }

                    // Affinità di coppia sulle vittorie standard in Attacco (2 vincitori)
                    if (info.side === 'attacco' && info.winners.length === 2) {
                        const sortedIds = [...info.winners].sort();
                        const pairKey = sortedIds.join('_');
                        if (!pairWins[pairKey]) {
                            const p1 = table.players.find(x => x.id === sortedIds[0])?.name || 'Giocatore 1';
                            const p2 = table.players.find(x => x.id === sortedIds[1])?.name || 'Giocatore 2';
                            pairWins[pairKey] = { names: `${p1} & ${p2}`, count: 0 };
                        }
                        pairWins[pairKey].count++;
                    }

                    // Aggiorna contatori individuali e strisce consecutive
                    table.players.forEach(p => {
                        const d = hand.deltas[p.id] || 0;
                        const st = playerStats[p.id];
                        if (!st) return;

                        if (d === 2) st.plus2Count++;
                        if (d === -1) st.minus1Count++;

                        const wonThisHand = info.winners.includes(p.id);
                        if (wonThisHand) {
                            st.wins++;
                            if (info.side === 'attacco') st.attackWins++;
                            if (info.side === 'difesa') st.defenseWins++;
                            st.currentStreak++;
                            if (st.currentStreak > st.bestStreak) {
                                st.bestStreak = st.currentStreak;
                            }
                        } else {
                            st.currentStreak = 0;
                        }
                    });
                });

                const sortedPlayers = Object.values(playerStats).sort((a, b) => b.wins - a.wins || b.score - a.score);
                const standardAttackTotal = Object.values(pairWins).reduce((sum, item) => sum + item.count, 0);
                const sortedPairs = Object.values(pairWins).sort((a, b) => b.count - a.count);

                return {
                    totalHands,
                    attackWins,
                    defenseWins,
                    attack120Wins,
                    defense120Wins,
                    sortedPlayers,
                    sortedPairs,
                    standardAttackTotal
                };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-12 p-5 bg-slate-50">
                    {/* ==================== VIEW: HOME ==================== */}
                    {view === 'home' && (
                        <div className="space-y-6">
                            <div className="flex justify-between items-center pt-1">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-3xl font-black text-slate-900 tracking-tight">Home</h1>
                                    <div className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[10px] font-black tracking-widest uppercase ${isConnected ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-600'}`}>
                                        <span className={`w-2 h-2 rounded-xs ${isConnected ? 'bg-emerald-500 live-square' : 'bg-red-500 animate-pulse'}`}></span>
                                        {isConnected ? 'LIVE' : 'OFF'}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setView('players')} className="bg-white text-slate-700 border border-slate-200 px-3.5 py-2.5 rounded-2xl shadow-xs font-bold text-xs flex items-center gap-1.5 active-tap">
                                        <Icon name="users" size={16} className="text-indigo-600" />
                                        Anagrafica
                                    </button>
                                    <button onClick={() => setView('new-table')} className="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md active-tap" title="Nuovo Tavolo">
                                        <Icon name="plus" size={20} />
                                    </button>
                                </div>
                            </div>

                            <div className="grid gap-4">
                                {tables.map(t => {
                                    const handsCount = (t.hands || []).length;
                                    return (
                                        <div key={t.id} onClick={() => { setActiveTableId(t.id); setView('detail'); }} className="card-white p-5 rounded-3xl border border-slate-200/80 shadow-xs active-tap cursor-pointer transition-all hover:border-indigo-200">
                                            <div className="flex justify-between items-center mb-3.5">
                                                <div className="flex items-center gap-2.5">
                                                    <h3 className="font-black text-xl text-slate-900">{t.name}</h3>
                                                    <span className="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">
                                                        {handsCount} {handsCount === 1 ? 'mano' : 'mani'}
                                                    </span>
                                                </div>
                                                <Icon name="chevron-right" className="text-slate-300" />
                                            </div>
                                            <div className="flex flex-wrap gap-1.5">
                                                {[...t.players].sort((a,b) => b.score - a.score).map(p => (
                                                    <span key={p.id} className="text-[11px] bg-slate-50 px-3 py-1.5 rounded-xl font-extrabold tracking-tight border border-slate-100 text-slate-700">
                                                        {p.name}: <span className={p.score < 0 ? 'text-rose-600' : 'text-indigo-600'}>{p.score}</span>
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                                {tables.length === 0 && isConnected && (
                                    <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
                                        <p className="text-slate-400 font-medium text-sm">Nessun tavolo attivo.</p>
                                        <button onClick={() => setView('new-table')} className="mt-3 text-indigo-600 font-black text-xs uppercase tracking-wider">+ Crea il primo tavolo</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ==================== VIEW: ANAGRAFICA ==================== */}
                    {view === 'players' && (
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 pt-1">
                                <button onClick={() => setView('home')} className="p-2.5 bg-white rounded-2xl border border-slate-200 shadow-xs active-tap">
                                    <Icon name="arrow-left" size={20} />
                                </button>
                                <h1 className="text-2xl font-black text-slate-900">Anagrafica</h1>
                            </div>

                            <div className="flex gap-2 p-2 card-white rounded-2xl border border-slate-200 shadow-xs">
                                <input className="flex-1 px-3 outline-none bg-transparent font-medium text-sm" placeholder="Nuovo giocatore..." value={newPlayerName} onChange={e => setNewPlayerName(e.target.value)} onKeyDown={e => e.key === 'Enter' && addPlayer()} />
                                <button onClick={addPlayer} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider active-tap">Aggiungi</button>
                            </div>

                            <div className="space-y-2.5">
                                {[...players].sort((a,b) => (b.championshipPoints || 0) - (a.championshipPoints || 0)).map((p, i) => (
                                    <div key={p.id} className="card-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-xs">
                                        <div className="flex items-center gap-3.5">
                                            <span className={`w-8 h-8 flex items-center justify-center rounded-xl font-black text-xs ${i === 0 && (p.championshipPoints || 0) > 0 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'}`}>
                                                {i + 1}
                                            </span>
                                            <div>
                                                <p className="font-black text-lg text-slate-900 leading-tight">{p.name}</p>
                                                <span className="text-amber-600 text-[11px] font-extrabold uppercase tracking-wide flex items-center gap-1 mt-0.5">
                                                    🏆 Campionati vinti: {p.championshipPoints || 0}
                                                </span>
                                            </div>
                                        </div>
                                        <button onClick={() => { if(confirm(`Eliminare ${p.name} dall'anagrafica?`)) window.fb.deleteDoc(window.fb.doc(window.db, ...baseP, 'players', p.id)); }} className="text-slate-300 hover:text-rose-500 p-2 active-tap">
                                            <Icon name="trash-2" size={18}/>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* ==================== VIEW: NUOVO TAVOLO ==================== */}
                    {view === 'new-table' && (
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 pt-1">
                                <button onClick={() => setView('home')} className="p-2.5 bg-white rounded-2xl border border-slate-200 shadow-xs active-tap">
                                    <Icon name="arrow-left" size={20} />
                                </button>
                                <h1 className="text-2xl font-black text-slate-900">Nuovo Tavolo</h1>
                            </div>

                            <input className="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none shadow-xs font-bold" placeholder="Nome del tavolo..." value={newTableName} onChange={e => setNewTableName(e.target.value)} />
                            
                            <div>
                                <p className="text-xs font-black uppercase tracking-wider text-slate-400 mb-2.5">
                                    Seleziona 5 giocatori ({selectedPlayers.length}/5)
                                </p>
                                <div className="grid grid-cols-2 gap-2.5">
                                    {players.map(p => {
                                        const isS = selectedPlayers.find(x => x.id === p.id);
                                        return (
                                            <button key={p.id} onClick={() => isS ? setSelectedPlayers(s => s.filter(x => x.id !== p.id)) : selectedPlayers.length < 5 && setSelectedPlayers(s => [...s, p])}
                                                className={`p-3.5 rounded-2xl border-2 font-bold transition-all text-left flex justify-between items-center ${isS ? 'border-indigo-600 bg-indigo-50 text-indigo-700' : 'border-slate-100 bg-white text-slate-700'}`}>
                                                <span>{p.name}</span>
                                                {isS && <Icon name="check" size={16} className="text-indigo-600" />}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <button disabled={selectedPlayers.length !== 5 || !newTableName.trim()} onClick={createTable} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-base uppercase tracking-wider shadow-md active-tap disabled:opacity-30">
                                Crea Tavolo
                            </button>
                        </div>
                    )}

                    {/* ==================== VIEW: DETTAGLIO TAVOLO ==================== */}
                    {view === 'detail' && activeTableId && (() => {
                        const currentTable = tables.find(x => x.id === activeTableId);
                        if (!currentTable) return null;

                        const hasPendingChanges = currentTable.players.some(p => (handDeltas[p.id] || 0) !== 0);
                        const pendingInfo = hasPendingChanges ? classifyHand(handDeltas) : null;
                        const handsList = currentTable.hands || [];
                        const lastHand = handsList.length > 0 ? handsList[handsList.length - 1] : null;

                        return (
                            <div className="space-y-4">
                                {/* Header Tavolo */}
                                <div className="flex justify-between items-center pt-1">
                                    <button onClick={() => setView('home')} className="p-2.5 bg-white rounded-2xl border border-slate-200 shadow-xs active-tap">
                                        <Icon name="arrow-left" size={20} />
                                    </button>
                                    <div className="flex items-center gap-1.5">
                                        <h1 className="font-black text-xl text-slate-900">{currentTable.name}</h1>
                                        <button onClick={() => renameTable(activeTableId, currentTable.name)} className="text-indigo-600 p-1.5 active-tap">
                                            <Icon name="edit-2" size={15} />
                                        </button>
                                    </div>
                                    <button onClick={() => { if(confirm("Eliminare definitivamente questo tavolo?")) { window.fb.deleteDoc(window.fb.doc(window.db, ...baseP, 'tables', activeTableId)); setView('home'); }}} className="p-2.5 bg-white rounded-2xl border border-slate-200 text-rose-400 active-tap">
                                        <Icon name="trash-2" size={18} />
                                    </button>
                                </div>

                                {/* Barra Azioni: Salva Mano (grande) + Annulla Ultima Mano (freccia a U stessa altezza) */}
                                <div className="flex items-stretch gap-2.5">
                                    <button 
                                        onClick={() => saveHand(activeTableId)}
                                        disabled={!hasPendingChanges}
                                        className={`flex-1 py-3.5 px-4 rounded-2xl font-black text-sm uppercase tracking-wider flex items-center justify-center gap-2 transition-all active-tap ${
                                            hasPendingChanges 
                                            ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' 
                                            : 'bg-slate-200/70 text-slate-400 cursor-not-allowed'
                                        }`}
                                    >
                                        <Icon name="check" size={19} />
                                        <span>
                                            {hasPendingChanges ? `Salva Mano • ${pendingInfo.label}` : 'Salva Mano'}
                                        </span>
                                    </button>

                                    <button 
                                        onClick={() => lastHand && setUndoStep(1)}
                                        disabled={!lastHand}
                                        title="Annulla ultima mano salvata"
                                        className={`w-14 rounded-2xl border flex items-center justify-center transition-all active-tap ${
                                            lastHand 
                                            ? 'bg-white border-slate-200 text-slate-700 shadow-xs hover:border-rose-300 hover:text-rose-600' 
                                            : 'bg-slate-100 border-slate-200/50 text-slate-300 cursor-not-allowed'
                                        }`}
                                    >
                                        <Icon name="undo-2" size={20} />
                                    </button>
                                </div>

                                {/* Schede Giocatori Compatte con Nomi e Punteggi Totali ben visibili */}
                                <div className="space-y-2.5">
                                    {currentTable.players.map(p => {
                                        const delta = handDeltas[p.id] || 0;
                                        let deltaStyle = 'bg-white text-slate-400 border-slate-200';
                                        if (delta === 1) deltaStyle = 'bg-emerald-100 text-emerald-700 border-emerald-300';
                                        if (delta === 2) deltaStyle = 'bg-amber-100 text-amber-700 border-amber-300';
                                        if (delta === -1) deltaStyle = 'bg-rose-100 text-rose-700 border-rose-300';

                                        return (
                                            <div key={p.id} className="card-white px-4 py-3 rounded-2xl border border-slate-200/80 flex justify-between items-center shadow-xs">
                                                {/* Nome grande + Punteggio totale del tavolo grande */}
                                                <div className="flex items-baseline gap-3 min-w-0 pr-2">
                                                    <span className="font-black text-xl text-slate-900 truncate">{p.name}</span>
                                                    <span className={`font-black text-2xl tabular-nums ${p.score < 0 ? 'text-rose-600' : 'text-indigo-600'}`}>
                                                        {p.score}
                                                    </span>
                                                </div>

                                                {/* Selettore punti della mano corrente (-1 .. +2) */}
                                                <div className="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-200/70 shrink-0">
                                                    <button 
                                                        onClick={() => changeHandDelta(p.id, -1)} 
                                                        disabled={delta <= -1}
                                                        className="w-10 h-10 bg-white rounded-xl border border-slate-200/80 flex items-center justify-center font-black text-xl text-slate-700 shadow-2xs active-tap disabled:opacity-25"
                                                    >
                                                        -
                                                    </button>
                                                    <span className={`w-10 h-10 rounded-xl border flex items-center justify-center font-black text-lg tabular-nums transition-colors ${deltaStyle}`}>
                                                        {delta > 0 ? `+${delta}` : delta}
                                                    </span>
                                                    <button 
                                                        onClick={() => changeHandDelta(p.id, 1)} 
                                                        disabled={delta >= 2}
                                                        className="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-xs active-tap disabled:opacity-25"
                                                    >
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Pulsante Statistiche */}
                                <button 
                                    onClick={() => setView('stats')} 
                                    className="w-full bg-white border border-indigo-200 text-indigo-700 py-3.5 px-4 rounded-2xl font-black text-xs uppercase tracking-wider shadow-xs active-tap flex items-center justify-between"
                                >
                                    <span className="flex items-center gap-2">
                                        <Icon name="bar-chart-2" size={18} className="text-indigo-600" />
                                        Statistiche Campionato
                                    </span>
                                    <span className="bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-lg text-[10px]">
                                        {handsList.length} mani →
                                    </span>
                                </button>

                                {/* Pulsante Termina Campionato */}
                                <button 
                                    onClick={() => endChampionship(activeTableId)} 
                                    className="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-white py-3.5 rounded-2xl font-black shadow-sm active-tap flex items-center justify-center gap-2 text-xs uppercase tracking-wider"
                                >
                                    <Icon name="trophy" size={16}/> Termina Campionato
                                </button>

                                {/* Storico sintetico ultime mani */}
                                <div className="pt-2">
                                    <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                                        <Icon name="history" size={13}/> Ultime Mani Registrate ({handsList.length})
                                    </h3>
                                    <div className="bg-white rounded-2xl border border-slate-200/80 p-3 max-h-40 overflow-y-auto space-y-1.5">
                                        {handsList.length > 0 ? (
                                            [...handsList].reverse().map((hand, idx) => {
                                                const info = classifyHand(hand.deltas);
                                                const summary = currentTable.players
                                                    .filter(p => (hand.deltas[p.id] || 0) !== 0)
                                                    .map(p => {
                                                        const v = hand.deltas[p.id];
                                                        return `${p.name} ${v > 0 ? `+${v}` : v}`;
                                                    })
                                                    .join(', ');
                                                return (
                                                    <div key={hand.id || idx} className="text-xs py-1.5 px-2 rounded-xl bg-slate-50/70 flex justify-between items-center gap-2">
                                                        <div className="truncate">
                                                            <span className={`inline-block text-[9px] font-black uppercase px-1.5 py-0.5 rounded mr-1.5 ${
                                                                info.side === 'attacco' ? 'bg-indigo-100 text-indigo-700' : 
                                                                info.side === 'difesa' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-700'
                                                            }`}>
                                                                {info.label}
                                                            </span>
                                                            <span className="font-bold text-slate-700">{summary}</span>
                                                        </div>
                                                        <span className="text-[10px] text-slate-400 font-semibold shrink-0">{hand.dateStr}</span>
                                                    </div>
                                                );
                                            })
                                        ) : (
                                            <p className="text-xs text-slate-400 italic text-center py-3">Nessuna mano ancora salvata.</p>
                                        )}
                                    </div>
                                </div>

                                {/* Modale Doppia Conferma Annullamento Ultima Mano */}
                                {undoStep > 0 && lastHand && (
                                    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-5" onClick={() => setUndoStep(0)}>
                                        <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 space-y-4" onClick={e => e.stopPropagation()}>
                                            <div className="flex items-center gap-2.5 text-rose-600">
                                                <div className="p-2 bg-rose-50 rounded-xl">
                                                    <Icon name="undo-2" size={22} />
                                                </div>
                                                <h3 className="font-black text-lg text-slate-900">
                                                    {undoStep === 1 ? 'Annullare ultima mano?' : 'Conferma definitiva'}
                                                </h3>
                                            </div>

                                            <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 text-xs space-y-1">
                                                <p className="text-slate-400 font-bold uppercase text-[10px]">Mano del {lastHand.dateStr}</p>
                                                <p className="font-black text-slate-800 text-sm">
                                                    {currentTable.players
                                                        .filter(p => (lastHand.deltas[p.id] || 0) !== 0)
                                                        .map(p => {
                                                            const v = lastHand.deltas[p.id];
                                                            return `${p.name} (${v > 0 ? `+${v}` : v})`;
                                                        }).join(' • ')}
                                                </p>
                                            </div>

                                            <p className="text-xs text-slate-500 leading-relaxed">
                                                {undoStep === 1 
                                                    ? 'I punti assegnati in questa mano verranno sottratti dal totale e la mano sarà rimossa dalle statistiche.' 
                                                    : 'Sei sicuro al 100%? Questa operazione cancellerà definitivamente l’ultima registrazione.'}
                                            </p>

                                            <div className="flex gap-2 pt-1">
                                                <button onClick={() => setUndoStep(0)} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs uppercase tracking-wider active-tap">
                                                    Chiudi
                                                </button>
                                                {undoStep === 1 ? (
                                                    <button onClick={() => setUndoStep(2)} className="flex-1 py-3 rounded-xl bg-amber-500 text-white font-black text-xs uppercase tracking-wider active-tap">
                                                        Procedi →
                                                    </button>
                                                ) : (
                                                    <button onClick={() => confirmUndoLastHand(activeTableId)} className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-black text-xs uppercase tracking-wider shadow-md active-tap">
                                                        Annulla Mano
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                    {/* ==================== VIEW: STATISTICHE TAVOLO ==================== */}
                    {view === 'stats' && activeTableId && (() => {
                        const currentTable = tables.find(x => x.id === activeTableId);
                        if (!currentTable) return null;

                        const stats = computeTableStats(currentTable);
                        const classifiedTotal = stats.attackWins + stats.defenseWins;
                        const attPct = classifiedTotal > 0 ? Math.round((stats.attackWins / classifiedTotal) * 100) : 0;
                        const defPct = classifiedTotal > 0 ? 100 - attPct : 0;

                        return (
                            <div className="space-y-5">
                                {/* Header Statistiche */}
                                <div className="flex items-center justify-between pt-1">
                                    <button onClick={() => setView('detail')} className="p-2.5 bg-white rounded-2xl border border-slate-200 shadow-xs active-tap">
                                        <Icon name="arrow-left" size={20} />
                                    </button>
                                    <div className="text-center">
                                        <h1 className="font-black text-xl text-slate-900">Statistiche</h1>
                                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{currentTable.name} • {stats.totalHands} mani</p>
                                    </div>
                                    <div className="w-10"></div>
                                </div>

                                {stats.totalHands === 0 ? (
                                    <div className="bg-white rounded-3xl p-10 text-center border border-slate-200/80">
                                        <p className="text-slate-400 text-sm font-medium">Registra almeno una mano per visualizzare le statistiche del campionato.</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Equilibrio Attacco vs Difesa */}
                                        <div className="card-white p-4 rounded-3xl border border-slate-200/80 shadow-xs space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-black uppercase tracking-wider text-slate-500">Equilibrio Tavolo</span>
                                                <span className="text-[11px] font-bold text-slate-400">{stats.totalHands} mani totali</span>
                                            </div>
                                            
                                            <div className="flex justify-between text-xs font-black">
                                                <span className="text-indigo-600 flex items-center gap-1">
                                                    <Icon name="swords" size={14} /> Attacco: {stats.attackWins} ({attPct}%)
                                                </span>
                                                <span className="text-emerald-600 flex items-center gap-1">
                                                    Difesa: {stats.defenseWins} ({defPct}%) <Icon name="shield" size={14} />
                                                </span>
                                            </div>

                                            <div className="w-full h-3 bg-emerald-500 rounded-full overflow-hidden flex">
                                                <div className="bg-indigo-600 h-full transition-all" style={{ width: `${attPct}%` }}></div>
                                            </div>

                                            {(stats.attack120Wins > 0 || stats.defense120Wins > 0) && (
                                                <div className="flex justify-between text-[10px] font-bold text-slate-500 pt-1 border-t border-slate-100">
                                                    <span>120 vinti: {stats.attack120Wins}</span>
                                                    <span>120 falliti: {stats.defense120Wins}</span>
                                                </div>
                                            )}
                                        </div>

                                        {/* Rendimento Individuale */}
                                        <div className="space-y-2.5">
                                            <h2 className="text-xs font-black uppercase tracking-wider text-slate-400 px-1">Rendimento Giocatori</h2>
                                            {stats.sortedPlayers.map((ps, idx) => {
                                                const winRate = stats.totalHands > 0 ? Math.round((ps.wins / stats.totalHands) * 100) : 0;
                                                return (
                                                    <div key={ps.id} className="card-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-2.5">
                                                        <div className="flex justify-between items-center">
                                                            <div className="flex items-center gap-2.5">
                                                                <span className={`w-6 h-6 rounded-lg text-[11px] font-black flex items-center justify-center ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                                                    {idx + 1}
                                                                </span>
                                                                <span className="font-black text-lg text-slate-900">{ps.name}</span>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="font-black text-base text-indigo-600">{winRate}%</span>
                                                                <span className="text-[10px] font-bold text-slate-400 ml-1">({ps.wins}/{stats.totalHands})</span>
                                                            </div>
                                                        </div>

                                                        {/* Dettagli: Attacco, Difesa, +2, -1, Striscia */}
                                                        <div className="grid grid-cols-4 gap-1.5 pt-1 border-t border-slate-100 text-center">
                                                            <div className="bg-indigo-50/70 rounded-xl py-1.5 px-1">
                                                                <p className="text-[9px] font-black uppercase text-indigo-400">Attacco</p>
                                                                <p className="font-black text-sm text-indigo-700">{ps.attackWins}</p>
                                                            </div>
                                                            <div className="bg-emerald-50/70 rounded-xl py-1.5 px-1">
                                                                <p className="text-[9px] font-black uppercase text-emerald-500">Difesa</p>
                                                                <p className="font-black text-sm text-emerald-700">{ps.defenseWins}</p>
                                                            </div>
                                                            <div className="bg-amber-50/80 rounded-xl py-1.5 px-1">
                                                                <p className="text-[9px] font-black uppercase text-amber-500">+2 / -1</p>
                                                                <p className="font-black text-sm text-slate-800">
                                                                    <span className="text-amber-600">{ps.plus2Count}</span>
                                                                    <span className="text-slate-300 mx-0.5">/</span>
                                                                    <span className="text-rose-600">{ps.minus1Count}</span>
                                                                </p>
                                                            </div>
                                                            <div className="bg-slate-100/80 rounded-xl py-1.5 px-1">
                                                                <p className="text-[9px] font-black uppercase text-slate-400">Striscia</p>
                                                                <p className="font-black text-sm text-slate-800 flex items-center justify-center gap-0.5">
                                                                    <Icon name="flame" size={12} className="text-orange-500" />
                                                                    {ps.bestStreak}
                                                                </p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Affinità di Coppia */}
                                        <div className="card-white p-4 rounded-3xl border border-slate-200/80 shadow-xs space-y-3">
                                            <div className="flex items-center justify-between">
                                                <h2 className="text-xs font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                                    <Icon name="heart" size={14} className="text-rose-500" />
                                                    Affinità di Coppia (Attacco)
                                                </h2>
                                                <span className="text-[10px] font-bold text-slate-400">{stats.standardAttackTotal} vittorie a 2</span>
                                            </div>

                                            {stats.sortedPairs.length > 0 ? (
                                                <div className="space-y-2">
                                                    {stats.sortedPairs.map((pair, idx) => {
                                                        const pct = stats.standardAttackTotal > 0 ? Math.round((pair.count / stats.standardAttackTotal) * 100) : 0;
                                                        return (
                                                            <div key={pair.names} className={`flex items-center justify-between p-2.5 rounded-2xl ${idx === 0 ? 'bg-amber-50/80 border border-amber-200/70' : 'bg-slate-50'}`}>
                                                                <div className="flex items-center gap-2">
                                                                    {idx === 0 && <span className="text-xs">👑</span>}
                                                                    <span className="font-black text-sm text-slate-800">{pair.names}</span>
                                                                </div>
                                                                <div className="text-right">
                                                                    <span className="font-black text-xs text-indigo-600">{pair.count} {pair.count === 1 ? 'vittoria' : 'vittorie'}</span>
                                                                    <span className="text-[10px] font-bold text-slate-400 ml-1.5">({pct}%)</span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ) : (
                                                <p className="text-xs text-slate-400 italic text-center py-2">Nessuna vittoria in coppia registrata.</p>
                                            )}
                                        </div>
                                    </>
                                )}
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
